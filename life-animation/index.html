<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ဘဝခရီးလမ်း - The Journey of Life</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Noto Sans Myanmar", "Pyidaungsu", "Myanmar Text", sans-serif;
    }
    #app {
      position: relative;
      width: 480px;
      height: 854px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; width: 480px; height: 854px; }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #title-card {
      position: absolute;
      top: 36px;
      left: 24px;
      right: 24px;
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    #title-mm { font-size: 34px; font-weight: 700; line-height: 1.3; }
    #title-en { font-size: 18px; margin-top: 6px; opacity: 0.95; }
    #subtitle {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 90px;
      text-align: center;
      color: #fff;
      font-size: 22px;
      line-height: 1.5;
      padding: 10px 12px;
      background: rgba(0,0,0,0.35);
      border-radius: 10px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    #scene-label {
      position: absolute;
      top: 12px;
      right: 14px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
    }
    #watermark {
      position: absolute;
      right: 12px;
      bottom: 12px;
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      font-weight: 600;
      padding: 4px 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="overlay">
      <div id="scene-label"></div>
      <div id="title-card">
        <div id="title-mm"></div>
        <div id="title-en"></div>
      </div>
      <div id="subtitle"></div>
      <div id="watermark"></div>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
